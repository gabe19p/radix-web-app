<h1>Company Leadership</h1>
<!-- pete -->
<div class="leader-wrapper one" #panel>
  <div class="leader-image">
    <img src="{{ leaders[0].image }}" alt="Headshot of {{ leaders[0].name }}" />
  </div>
  <div class="leader-info">
    <div class="leader-name" (click)="openModal(leaders[0])">
      <p>{{ leaders[0].name}}</p>
    </div>
    <div class="leader-title">
      <p>{{ leaders[0].title}}</p>
    </div>
    <div class="leader-bio">
      <p>{{ leaders[0].bio}}</p>
    </div>
  </div>
</div>
<!-- krit -->
<div class="leader-wrapper two" #panel>
  <div class="leader-info">
    <div class="leader-name" (click)="openModal(leaders[1])">
      <p>{{ leaders[1].name}}</p>
    </div>
    <div class="leader-title">
      <p>{{ leaders[1].title}}</p>
    </div>
    <div class="leader-bio">
      <p>{{ leaders[1].bio}}</p>
    </div>
  </div>
  <div class="leader-image">
    <img src="{{ leaders[1].image }}" alt="Headshot of {{ leaders[1].name }}" />
  </div>
</div>

<h1>Company Directors</h1>

<div class="sub-leader-grid">
  <div
    class="sub-leader-wrapper"
    #card
    *ngFor="let sublead of subleaders"
    (click)="openModal(sublead)"
  >
    <div class="sub-leader-image">
      <img [src]="sublead.image" alt="" />
      <div class="overlay">
        <h3>{{ sublead.name }}</h3>
      </div>
    </div>
    <p>{{ sublead.title }}</p>
  </div>
</div>

<app-leader-modal
  *ngIf="selectedLeader"
  [leader]="selectedLeader"
  (closeModal)="closeModal()"
>
</app-leader-modal>

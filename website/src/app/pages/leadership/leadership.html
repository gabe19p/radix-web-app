<div class="container">
  <!-- page title -->
  <h1>meet the team</h1>

  <div class="leader-grid">
    <div
      class="leader-wrapper"
      #card
      *ngFor="let person of leaders"
      (click)="openModal(person)"
    >
      <div class="image-wrapper">
        <img [src]="person.image" [alt]="person.name" />
        <div class="overlay">
          <h3>{{ person.name }}</h3>
          <p>{{ person.title }}</p>
        </div>
      </div>
    </div>
  </div>

  <app-leader-modal
    *ngIf="selectedLeader"
    [leader]="selectedLeader"
    (closeModal)="closeModal()"
  >
  </app-leader-modal>
</div>

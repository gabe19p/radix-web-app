<section class="what-we-do-hero">
  <video autoplay muted loop playsinline class="bg-video">
    <source src="../../../assets/videos/wwd(black).mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>

  <div class="hero-wrapper">
    <h1 class="hero-title">
      <span id="heroText">Our Domains of Expertise</span>
    </h1>
    <p>Building What Matters - Where It Matters.</p>
  </div>
</section>

<!-- Spacer to push next section down -->
<div style="height: 100vh; background-color: transparent !important"></div>

<section class="what-we-do-capabilities">
  <div class="capabilities-wrapper container-md raised">
    <h1 class="capabilities-title">Core Capabilities</h1>
    <div class="capabilities-grid">
      <div
        class="capability"
        *ngFor="let cap of capabilities"
        (click)="openCap(cap.id)"
      >
        <div class="sphere" [innerHTML]="cap.icon"></div>
        <h2 class="title">{{ cap.title }}</h2>
      </div>
    </div>
  </div>
</section>

<section class="what-we-do-cta container-md">
  <!-- <video autoplay muted loop playsinline class="bg-video">
    <source src="../../../assets/videos/stars.mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video> -->
  <div class="cta-wrapper container">
    <h1 class="cta-title">
      <span id="ctaText">Creating Space for Change</span>
    </h1>
    <div class="button-wrapper">
      <a href="/careers" class="cta-button">Explore Opportunities</a>
    </div>
  </div>
</section>
